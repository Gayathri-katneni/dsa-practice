name: DSA Repository Check

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Check repository
        shell: bash
        run: |
          if [ ! -f README.md ]; then
            echo "::error::README.md is missing"
            exit 1
          fi

          count=$(find . -mindepth 1 -maxdepth 1 \
            -type d ! -name '.git' ! -name '.github' | wc -l)

          echo "README.md exists."
          echo "Top-level solution folders: $count"
          echo "Repository check completed."
