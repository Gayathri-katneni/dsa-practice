
name: Claude Daily DSA Backup

on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  check-activity:
    runs-on: ubuntu-latest
    outputs:
      practiced: ${{ steps.activity.outputs.practiced }}

    steps:
      - name: Check today's DSA contributions
        id: activity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: Gayathri-katneni
        run: |
          set -euo pipefail

          DAY=$(TZ=Asia/Kolkata date +%F)
          START="${DAY}T00:00:00+05:30"
          END=$(TZ=Asia/Kolkata date --iso-8601=seconds)

          echo "Checking DSA commits for $DAY"

          SHAS=$(gh api \
            --method GET \
            --paginate \
            --slurp \
            "repos/${GITHUB_REPOSITORY}/commits" \
            -f author="$GH_USER" \
            -f since="$START" \
            -f until="$END" \
            -f per_page=100 |
            jq -r '.[][] | .sha')

          COUNT=0

          for SHA in $SHAS; do
            FILES=$(gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/commits/${SHA}" \
              --jq '.files[]?.filename')

            if printf '%s\n' "$FILES" |
              grep -Eq '^[0-9]+ - [^/]+/'; then
              COUNT=$((COUNT + 1))
            fi
          done

          echo "DSA practice commits found today: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "practiced=true" >> "$GITHUB_OUTPUT"
            echo "DSA practice detected. Claude will be skipped."
          else
            echo "practiced=false" >> "$GITHUB_OUTPUT"
            echo "No DSA practice detected. Claude maintenance will run."
          fi

  claude-backup:
    needs: check-activity
    if: needs.check-activity.outputs.practiced == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Claude DSA maintenance
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            You are an AI maintenance assistant for this DSA practice repository.

            The activity checker found no DSA practice commits from the
            repository owner today.

            FIRST:
            1. Fetch the latest main branch.
            2. Inspect the repository structure and existing solutions.
            3. Inspect open pull requests.
            4. Check that your proposed improvement does not already exist.

            Choose at most ONE genuinely useful improvement.

            Suitable improvements:
            - Fix a genuine bug in an existing solution.
            - Improve an existing solution meaningfully.
            - Add useful test cases.
            - Add missing explanations.
            - Add time and space complexity analysis.
            - Add a classic DSA problem only if it is missing.

            STRICT RULES:
            - Never duplicate an existing problem or solution.
            - Never repeat work already present in an open pull request.
            - Never create empty or artificial changes.
            - Do not modify unrelated files.
            - Follow existing repository conventions.
            - Run relevant tests and inspect the final diff.
            - If no meaningful improvement exists, make no changes.
            - Never modify main directly.
            - Never impersonate the repository owner.
            - Clearly identify all work as AI-authored.

            PUBLISHING:
            - Create a separate branch from the latest main.
            - Commit only meaningful, tested changes.
            - Push the branch to origin.
            - If useful changes were made, use GitHub CLI
              (gh pr create) to open a pull request against main.
            - Include a clear title, description and test results.
            - If there are no changes, do not create a branch or PR.
            - Never merge a pull request.

            Finally report what you did, which tests ran,
            and the pull request URL if one was created.

          claude_args: |
            --max-turns 15
            --append-system-prompt "Work only within this repository. Never claim AI-authored commits are the user's personal contributions."
