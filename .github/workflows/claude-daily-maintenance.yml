
name: Claude Daily DSA Backup

on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  check-activity:
    runs-on: ubuntu-latest
    outputs:
      practiced: ${{ steps.activity.outputs.practiced }}

    steps:
      - name: Check today's DSA contributions
        id: activity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: Gayathri-katneni
        run: |
          DAY=$(TZ=Asia/Kolkata date +%F)
          START="${DAY}T00:00:00+05:30"
          END=$(TZ=Asia/Kolkata date --iso-8601=seconds)

          COUNT=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/commits" \
            -f author="$GH_USER" \
            -f since="$START" \
            -f until="$END" \
            -f per_page=100 \
            -q 'length')

          echo "Commits found today in this repository: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "practiced=true" >> "$GITHUB_OUTPUT"
          else
            echo "practiced=false" >> "$GITHUB_OUTPUT"
          fi

  claude-backup:
    needs: check-activity
    if: needs.check-activity.outputs.practiced == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Claude DSA maintenance
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are an AI maintenance assistant for this DSA practice repository.

            The activity checker found no commit from the repository owner today.
            Work only in this repository.

            IMPORTANT FIRST STEPS:
            1. Fetch the latest main branch from origin.
            2. Inspect the latest main branch, not an old branch or stale copy.
            3. Inspect the repository structure, README, existing problem folders,
               solution files, and open pull requests.
            4. Check carefully that your proposed work does not already exist.

            Choose at most ONE genuinely useful improvement.

            Suitable work:
            - Fix a real bug in an existing solution.
            - Improve an existing solution meaningfully.
            - Add useful test cases.
            - Add missing explanations or complexity analysis.
            - Add a classic DSA problem only if it is genuinely missing.

            STRICT RULES:
            - Never duplicate an existing problem or solution.
            - Never repeat work already present in an open pull request.
            - Never create empty, artificial, or cosmetic-only changes.
            - Do not modify unrelated files.
            - Follow the repository's existing naming and coding conventions.
            - Run relevant tests or checks and inspect your final diff.
            - If no meaningful improvement exists, make no changes and stop.
            - Never modify main directly.
            - Never impersonate the repository owner.
            - Keep all AI-authored work transparent.

            PUBLISHING:
            - Create a new branch from the latest origin/main.
            - Commit only meaningful, tested changes.
            - Push the branch to origin.
            - If changes were successfully made, use GitHub CLI
              (gh pr create) to open a pull request against main.
            - Give the PR a clear title and explain the changes and tests.
            - If there are no changes, do not create a branch or PR.
            - Never merge a pull request.

            At the end, report whether you made changes, which tests ran,
            and the pull request URL if one was created.

          claude_args: |
            --max-turns 15
            --append-system-prompt "Work only within this repository. Never claim AI-authored commits are the user's personal contributions."
